<!doctype html>
<html lang="sr"><head><meta charset="utf-8">
<style>
:root{--bg:#D0021B;--ink:#FFFFFF;--mute:#FFD9DC;--gold:#FFD23F;--re:#FFF3B0;--im:#FF8FD8}
html,body{margin:0;width:540px;height:960px;background:var(--bg);overflow:hidden}
#cap{position:absolute;left:0;top:0;width:540px;height:205px;box-sizing:border-box;padding:34px 28px 0;text-align:center;color:var(--ink)}
#k{font:600 15px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
#m{font:600 33px/1.18 Lora,serif;margin-bottom:12px}
#s{font:400 21px/1.42 Inter,sans-serif;color:#FFFFFF}
#s b{color:var(--gold);font-weight:600}
.g{color:var(--gold)}.r{color:var(--re)}.i{color:var(--im)}
#app{position:absolute;left:0;top:200px;width:540px;height:760px;border:0}
#fade{position:absolute;inset:0;background:var(--bg);pointer-events:none;opacity:0}
</style></head><body>
<div id="cap"><div id="k"></div><div id="m"></div><div id="s"></div></div>
<iframe id="app" src="../../index.html"></iframe>
<div id="fade"></div>
<script>
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const seg=(u,a,b)=>ease((u-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
let D,W;
const LAST={};let CUR=0,CURS=-1;
function setv(id,v){const e=D.getElementById(id);const old=+e.value;e.value=v;if(Math.abs(+e.value-old)>1e-9)LAST[id]=CUR;e.dispatchEvent(new Event('input'));}
function tab(t){const b=D.querySelector(`[data-t=${t}]`);if(b.getAttribute('aria-selected')!=='true')b.click();}
function cap(list,u){let c=list[0];for(const q of list)if(u>=q[0])c=q;
  const a=list.indexOf(c)===0?1:seg(u,c[0],c[0]+.5);
  document.getElementById('k').innerHTML=c[1];document.getElementById('m').innerHTML=c[2];document.getElementById('s').innerHTML=c[3];
  document.getElementById('cap').style.opacity=a;}
const SC=[
 {d:17,cap:[
   [0,'Lekcija 0 · Redovi kukuruza','Svaki red je jedna traka','Poštar meri dužinu svakog reda i množi je razmakom <b>Δx</b>.'],
   [4.5,'Gušća setva','Više redova, <span class="g">manja greška</span>','4 reda: greška 1,1 %. 8 redova: <b>0,25 %</b>.'],
   [11,'Određeni integral','P = ∫ f(x) dx ≈ <span class="g">28,5 ari</span>','Kad razmak postane <b>infinitezimalan</b>, zbir postaje integral.']],
  f(u){tab('red');let n;if(u<2)n=2;else if(u<4.5)n=4;else if(u<7.5)n=8;else n=Math.round(8+72*seg(u,7.6,11));setv('n',n);}},
 {d:12,cap:[
   [0,'Lekcija 1 · Gornja i donja suma','Kad prodaje i kad plaća porez','<span class="g">Kad prodaje</span>, meri do najdalje tačke reke. <span class="i">Kad plaća porez</span>, do najbliže.'],
   [7,'Integral postoji','Kupac i poreska se <span class="g">slažu</span>','Na infinitezimalnim parcelama gornja i donja suma se poklope.']],
  f(u){tab('dar');setv('m',Math.round(lerp(3,80,seg(u,2.5,9.5))));}},
 {d:14,cap:[
   [0,'Lekcija 2 · Kilometar-sat','∫ v dt = s(b) − s(a)','Za vreme dt poštar pređe v·dt. Kilometar-sat <b>sabira</b> te delove: površina ispod krive je put.'],
   [6.6,'Zaboravio paket','v &lt; 0: površina se <span class="i">oduzima</span>','Vraća se po paket, pa se udaljenost od pošte smanjuje.'],
   [11.4,'Kraj dana','Pomeraj <span class="g">0</span>, pređeno <span class="g">50,9 km</span>','Vratio se u poštu. <b>Pomeraj i pređeni put nisu isto.</b>']],
  f(u){tab('km');setv('t',(8*seg(u,1,11.2)).toFixed(2));}},
 {d:12,cap:[
   [0,'Lekcija 3 · Neodređeni integral','Poštar bez adrese: <span class="i">+ C</span>','Svi poštari voze istom brzinom. Razlikuju se samo po <b>polazištu</b>.'],
   [6,'Početni uslov','Polazi iz pošte: <span class="i">C = 0</span>','Tangente ostaju paralelne. Tek sad poštar ima <b>adresu</b>.']],
  f(u){tab('cc');setv('c',(lerp(22,0,seg(u,1,5.6))*2|0)/2);setv('tc',lerp(0.5,6,seg(u,6.4,11)).toFixed(2));}},
 {d:11,cap:[
   [0,'Lekcija 4 · Primena','Koliko je kiše palo?','Za infinitezimalno vreme dt padne i(t)·dt mm. Zbir je <b>površina ispod krive</b>.'],
   [5.6,'Računa se površina','Pljusak ili rominjanje?','Kratak jak pljusak i dugo rominjanje mogu dati <b>isti integral</b>.']],
  f(u){tab('kisa');if(u<5.6){setv('A',(lerp(6,18,seg(u,1,4.6))*2|0)/2);setv('w',lerp(2,0.8,seg(u,1,4.6)).toFixed(1));}else{setv('A',(lerp(18,1.5,seg(u,6,10))*2|0)/2);setv('w',lerp(0.8,6,seg(u,6,10)).toFixed(1));}}},
];
const SLOW=1.45;SC.forEach(q=>{q.d0=q.d;q.d=+(q.d*SLOW).toFixed(2);});window.SC=SC;
window.ready=new Promise(r=>{document.getElementById('app').addEventListener('load',()=>{
  D=document.getElementById('app').contentDocument;W=document.getElementById('app').contentWindow;
  const st=D.createElement('style');st.textContent=`.wrap{padding:6px 14px 0!important}h1,.sub,.qm,.foot,.legend{display:none!important}
  .tabs{margin:0 0 8px!important;display:flex!important;justify-content:center!important}.tabs button{min-width:260px}.tabs button[aria-selected=false]{display:none}
  .fig{height:432px!important}.btns{display:none!important}.row{border-radius:12px;padding:0 8px;transition:none}.row.live{background:rgba(255,210,63,.16);box-shadow:inset 0 0 0 1.5px rgba(255,210,63,.6)}.eq{margin:12px 0 0!important;font-size:24px!important}.grid{margin-top:10px!important;gap:10px!important}
  .grid>.panel:nth-child(2){display:none}.panel{padding:10px 16px!important}.row{min-height:46px!important}`;
  D.head.appendChild(st);W.dispatchEvent(new Event('resize'));setTimeout(r,300);});});
window.renderApp=(si,ur)=>{const s=SC[si];const u=ur/SLOW;const fh=[560,560,560,470,470][si];const fg=D.querySelector('.fig');if(fg.style.height!==fh+'px'){fg.style.setProperty('height',fh+'px','important');W.dispatchEvent(new Event('resize'));}if(si!==CURS){for(const k in LAST)delete LAST[k];CURS=si;}CUR=u;s.f(u);if(u<0.05)for(const k in LAST)delete LAST[k];D.querySelectorAll('.row').forEach(r=>{const i=r.querySelector('input');r.classList.toggle('live',!!i&&LAST[i.id]!==undefined&&u-LAST[i.id]<1.2);});cap(s.cap,u);document.getElementById('fade').style.opacity=Math.max(1-cl(ur/.4),1-cl((s.d-ur)/.4));};
</script></body></html>
